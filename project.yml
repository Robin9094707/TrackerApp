name: RJTracker

options:
  deploymentTarget:
    iOS: "18.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.1"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "5.1.0"
    CURRENT_PROJECT_VERSION: "17"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  SwiftECC:
    url: https://github.com/leif-ibsen/SwiftECC.git
    exactVersion: 5.4.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.29.0
  Digest:
    url: https://github.com/leif-ibsen/Digest
    exactVersion: 1.12.0
  BigInt:
    url: https://github.com/leif-ibsen/BigInt
    exactVersion: 1.21.0
  ASN1:
    url: https://github.com/leif-ibsen/ASN1
    exactVersion: 2.7.0
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    exactVersion: 1.8.4

targets:
  SpotIntegration:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/Spot/Sources
      - path: Vendor/Spot/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Vendor/Spot/Licenses
        buildPhase: resources
      - path: Vendor/Spot/LICENSE
        buildPhase: resources
    dependencies:
      - package: SwiftECC
      - package: SwiftProtobuf
      - package: CryptoSwift
      - package: Digest
      - package: BigInt
      - package: ASN1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjtracker.spotintegration
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
  RJTracker:
    type: application
    platform: iOS
    dependencies:
      - target: SpotIntegration
        embed: true
    sources:
      - path: App
        excludes:
          - Info.plist
          - RJTracker.entitlements
          - Resources
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjtracker
        PRODUCT_NAME: RJTracker
        PRODUCT_MODULE_NAME: RJTracker
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/RJTracker.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SpotIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpotTests]
    dependencies:
      - target: SpotIntegration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjtracker.spot.tests
        GENERATE_INFOPLIST_FILE: YES
  RJTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [GoogleProtocolChecks.swift]
    dependencies:
      - target: RJTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjtracker.tests
        GENERATE_INFOPLIST_FILE: YES
  RJTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RJTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjtracker.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RJTracker:
    build:
      targets:
        RJTracker: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - SpotIntegrationTests
        - RJTrackerTests
        - RJTrackerUITests



