name: Build Tracker 7 preview IPA

on:
  push:
    branches: [codex/tracker-7-preview-ipa]

permissions:
  contents: read

concurrency:
  group: rj-tracker-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build unsigned preview IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          else
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)"
            test -n "$XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Test Google transport deadlines and streaming
        shell: bash
        run: |
          swiftc Vendor/Spot/Sources/GooglePreferenceStorage.swift Vendor/Spot/Sources/GoogleCallback.swift Vendor/Spot/Sources/GoogleMCSDecoder.swift Tests/GoogleProtocolChecks.swift -o /tmp/google-protocol-checks
          /tmp/google-protocol-checks
          xcrun momc Vendor/Spot/Sources/CoreData/DataModel.xcdatamodeld /tmp/GoogleDataModel.momd
          swiftc -parse-as-library Tests/GoogleMigrationCheck.swift -o /tmp/google-migration-check
          /tmp/google-migration-check /tmp/GoogleDataModel.momd

      - name: Generate app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/generate_app_icon.py

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist App/RJTracker.entitlements
          xcodebuild -project RJTracker.xcodeproj -scheme RJTracker -showBuildSettings >/dev/null

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project RJTracker.xcodeproj \
            -scheme RJTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-Tracker-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
          test -n "$(find "$APP" -name 'AppIcon*.png' -print -quit)"
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-Tracker-v7.0.0-PREVIEW-unsigned.ipa Payload
          unzip -t RJ-Tracker-v7.0.0-PREVIEW-unsigned.ipa
          shasum -a 256 RJ-Tracker-v7.0.0-PREVIEW-unsigned.ipa > SHA256SUMS.txt
          ls -lh RJ-Tracker-v7.0.0-PREVIEW-unsigned.ipa
          echo "### RJ Tracker 7.0.0 PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview IPA ready for sideload signing. Full simulator validation is separate and may still be incomplete." >> "$GITHUB_STEP_SUMMARY"

      - name: Describe preview validation status
        shell: bash
        run: |
          cat > PREVIEW.txt <<'NOTICE'
          RJ Tracker 7.0.0 - unsigned PREVIEW
          Application source: 68cd2d6a7050411b21cc828c1ca58f7249c53e4d
          This build packages the device Release app without waiting for simulator tests.
          It is not a fully validated release. Sign the IPA with your usual identity before installation.
          Full validation: https://github.com/Robin9094707/TrackerApp/actions/runs/42249385578
          NOTICE
          echo "Preview build commit: $GITHUB_SHA" >> PREVIEW.txt

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RJ-Tracker-v7.0.0-PREVIEW-unsigned-IPA
          path: |
            RJ-Tracker-v7.0.0-PREVIEW-unsigned.ipa
            SHA256SUMS.txt
            PREVIEW.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

