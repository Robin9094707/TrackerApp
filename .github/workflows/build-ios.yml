name: Build RJ Tracker IPA

on:
  push:
    branches: [main, liquid-glass-v2]
    paths-ignore:
      - 'Backend/**'
      - 'Tests/test_backend*.py'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/backend-apple.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      review:
        description: Run focused unit tests and capture the history screen
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rj-tracker-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Calendar, MCP discovery, maintenance and migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install -r Backend/requirements.txt
      - run: python -m py_compile Backend/tracker_backend.py
      - run: python Tests/test_backend_calendar_mcp.py -v
      - run: python Tests/test_backend_refresh.py -v
      - name: Validate single-file AMP package
        run: |
          python Scripts/package_amp_backend.py Tracker_Backend_AMP.py
          python Tracker_Backend_AMP.py --amp-check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: RJ-Tracker-Backend-20.4.2-AMP
          path: Tracker_Backend_AMP.py
          if-no-files-found: error
          retention-days: 30
  build:
    needs: backend
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          else
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)"
            test -n "$XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Test Google transport deadlines and streaming
        shell: bash
        run: |
          swiftc Vendor/Spot/Sources/GooglePreferenceStorage.swift Vendor/Spot/Sources/GoogleCallback.swift Vendor/Spot/Sources/GoogleMCSDecoder.swift Tests/GoogleProtocolChecks.swift -o /tmp/google-protocol-checks
          /tmp/google-protocol-checks
          xcrun momc Vendor/Spot/Sources/CoreData/DataModel.xcdatamodeld /tmp/GoogleDataModel.momd
          swiftc -parse-as-library Tests/GoogleMigrationCheck.swift -o /tmp/google-migration-check
          /tmp/google-migration-check /tmp/GoogleDataModel.momd

      - name: Generate app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/generate_app_icon.py

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist App/RJTracker.entitlements
          xcodebuild -project RJTracker.xcodeproj -scheme RJTracker -showBuildSettings >/dev/null

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project RJTracker.xcodeproj \
            -scheme RJTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-Tracker-build.log

      - name: Required startup and native Google tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          SIM_ID="$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; phones=[p for k,v in d.items() if "iOS" in k for p in v if p["name"].startswith("iPhone")]; phones.sort(key=lambda p: ("Pro" not in p["name"], p["name"])); print(phones[0]["udid"])')"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild test \
            -project RJTracker.xcodeproj -scheme RJTracker \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath RJ-Tracker-tests.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:SpotIntegrationTests \
            -only-testing:RJTrackerUITests/TrackerUITests/testColdStartAndRelaunchWithoutSession \
            -only-testing:RJTrackerTests \
            -only-testing:RJTrackerUITests/TrackerUITests/testGoogleDetailsUseOneTitleAndDirectRefresh \
            -only-testing:RJTrackerUITests/TrackerUITests/testAccountSecurityAndHistory \
            -only-testing:RJTrackerUITests/TrackerUITests/testMapLibraryDetailsAndPlaces \
            -only-testing:RJTrackerUITests/TrackerUITests/testLocalGoogleCanOpenAndReturnToExistingTrackers \
            -only-testing:RJTrackerUITests/TrackerUITests/testLocalGoogleFallbackAndProviderScopedControls \
            -only-testing:RJTrackerUITests/TrackerUITests/testGoogleIsAccessibleWhileServerRestoresAndUWBLabDoesNotPromiseRanging \
            -only-testing:RJTrackerUITests/TrackerUITests/testMotorolaFirmwareScreenRequiresOriginalAndHardwareBeforeInstall \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee RJ-Tracker-tests.log

      - name: Required Release cold start and relaunch
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          SIM_ID="$(xcrun simctl list devices booted --json | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(p["udid"] for v in d.values() for p in v if p["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project RJTracker.xcodeproj -scheme RJTrackerReleaseLaunch \
            -configuration Release -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath RJ-Tracker-release-tests.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:RJTrackerUITests/TrackerUITests/testColdStartAndRelaunchWithoutSession \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee RJ-Tracker-release-tests.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
          test -n "$(find "$APP" -name 'AppIcon*.png' -print -quit)"
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-Tracker-v5.5.1-unsigned.ipa Payload
          unzip -t RJ-Tracker-v5.5.1-unsigned.ipa
          shasum -a 256 RJ-Tracker-v5.5.1-unsigned.ipa > SHA256SUMS.txt
          ls -lh RJ-Tracker-v5.5.1-unsigned.ipa
          echo "### RJ Tracker 5.5.1" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned IPA ready for sideload signing." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RJ-Tracker-v5.5.1-unsigned-IPA
          path: |
            RJ-Tracker-v5.5.1-unsigned.ipa
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Export simulator screenshots
        if: always()
        shell: bash
        run: |
          if [ -d RJ-Tracker-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path RJ-Tracker-tests.xcresult --output-path TestScreenshots || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RJ-Tracker-v5.5.1-tests-and-screenshots
          path: |
            RJ-Tracker-tests.log
            RJ-Tracker-release-tests.log
            TestScreenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RJ-Tracker-v5.5.1-build-log
          path: RJ-Tracker-build.log
          if-no-files-found: ignore
          retention-days: 30




