name: Build RJ Tracker IPA

on:
  push:
    branches: [main, liquid-glass-v2]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rj-tracker-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          else
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)"
            test -n "$XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Generate app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/generate_app_icon.py

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint App/Info.plist App/RJTracker.entitlements
          xcodebuild -project RJTracker.xcodeproj -scheme RJTracker -showBuildSettings >/dev/null

      - name: Run iOS tests and capture simulator screens
        shell: bash
        run: |
          set -o pipefail
          SIM_ID="$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; phones=[p for k,v in d.items() if "iOS" in k for p in v if p["name"].startswith("iPhone")]; phones.sort(key=lambda p: ("Pro" not in p["name"], p["name"])); print(phones[0]["udid"])')"
          xcodebuild test \
            -project RJTracker.xcodeproj -scheme RJTracker \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath RJ-Tracker-tests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee RJ-Tracker-tests.log

      - name: Export simulator screenshots
        if: always()
        shell: bash
        run: |
          if [ -d RJ-Tracker-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path RJ-Tracker-tests.xcresult --output-path TestScreenshots || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Tracker-v2.1.1-tests-and-screenshots
          path: |
            RJ-Tracker-tests.log
            TestScreenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived
          xcodebuild \
            -project RJTracker.xcodeproj \
            -scheme RJTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-Tracker-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
          test -n "$(find "$APP" -name 'AppIcon*.png' -print -quit)"
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-Tracker-v2.1.1-unsigned.ipa Payload
          unzip -t RJ-Tracker-v2.1.1-unsigned.ipa
          ls -lh RJ-Tracker-v2.1.1-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Tracker-v2.1.1-unsigned-IPA
          path: RJ-Tracker-v2.1.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Tracker-v2.1.1-build-log
          path: RJ-Tracker-build.log
          if-no-files-found: ignore
          retention-days: 30

