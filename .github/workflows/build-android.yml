name: Build RJ Tracker Android

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Android/**'
      - 'Backend/**'
      - 'Scripts/android_e2e_fixture.py'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Android/**'
      - 'Backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rj-tracker-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: RJ-Tracker-Android-v1.1.0.apk

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37 on the preinstalled runner SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests and release APK
        env:
          # Optional secret. Without it the app uses its built-in OpenStreetMap map.
          ANDROID_MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RJ_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rjtracker-android.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/rjtracker-android.jks"
            echo "Signatur: eigener RJ-Tracker-Schlüssel (Updates installierbar)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – APK ist nur mit einem Test-Schlüssel signiert und kann nicht über eine vorhandene Installation aktualisiert werden."
            echo "Signatur: Test-Schlüssel (Secret ANDROID_KEYSTORE_BASE64 fehlt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../$APK_NAME"
          cd .. && sha256sum "$APK_NAME" > SHA256SUMS-Android.txt
          echo "### RJ Tracker Android" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $APK_NAME (versionCode ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ANDROID_MAPS_API_KEY" ]; then echo "Karte: Google Maps" >> "$GITHUB_STEP_SUMMARY"; else echo "Karte: OpenStreetMap (Secret ANDROID_MAPS_API_KEY nicht gesetzt)" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: RJ-Tracker-Android-APK
          path: |
            ${{ env.APK_NAME }}
            SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Emulator end-to-end (real backend, school link)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v5
        with:
          name: RJ-Tracker-Android-APK
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Start backend with school-bag fixture
        run: |
          python -m pip install -r Backend/requirements.txt
          python Scripts/android_e2e_fixture.py "$RUNNER_TEMP/e2e-data" > token.txt
          ULTRA_TRACKER_DATA_DIR="$RUNNER_TEMP/e2e-data" ULTRA_TRACKER_DISABLE_BACKGROUND=1 \
          ULTRA_TRACKER_PASSWORD=e2e-password-123 ULTRA_TRACKER_PORT=5000 \
            nohup python Backend/tracker_backend.py > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:5000/api/school/$(cat token.txt)" > /dev/null && break; sleep 1; done
          curl -sf "http://127.0.0.1:5000/api/school/$(cat token.txt)" | head -c 400
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash Android/e2e/run-emulator-e2e.sh "$APK_NAME" "$(cat token.txt)" e2e-output
      - name: Backend log
        if: always()
        run: tail -n 80 backend.log || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: RJ-Tracker-Android-E2E-Screenshots
          path: e2e-output
          retention-days: 14
