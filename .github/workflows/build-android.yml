name: Build RJ Tracker Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rj-tracker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare versioned APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk RJ-Tracker-Share-v1.0.0-debug.apk
          sha256sum RJ-Tracker-Share-v1.0.0-debug.apk > RJ-Tracker-Share-v1.0.0-debug.apk.sha256
          ls -lh RJ-Tracker-Share-v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Tracker-Share-v1.0.0-Android-APK
          path: |
            RJ-Tracker-Share-v1.0.0-debug.apk
            RJ-Tracker-Share-v1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
