syntax = "proto3";


message WebloginAuthResponse {
    optional WebloginCookies webloginCookies = 1;
    
    message WebloginCookies {
        optional int32 resultCode = 1;
        repeated Cookie cookies = 2;
        
        message Cookie {
            optional string cookieName = 1;
            optional string cookieValue = 2;
            optional string domain = 3;
            optional string subDomain = 4;
            optional string path = 5;
            optional bool secure = 6;
            optional bool httpOnly = 7;
            optional int64 maxAge = 8;
        }
    }
}

message UpdateBleDeviceSharingSettingsResponse {
    repeated AccessInformation accessInformation = 1;
    DeviceRegistration deviceRegistration = 2;
}

message InvitationToken {
    bytes canonicId = 1;
    sfixed64 sharingID = 2;
    bytes ownerPublicKey = 3;
}

message UpdateBleDeviceSharingSettingsRequest {
    CanonicId canonicId = 1;
    SharingOperation operation = 2;
    string updateForAccount = 3;
    EncryptedUserSecrets encryptedUserSecrets = 5;
    sfixed64 sharingID = 6;
    bytes encryptedPrivateKeyWrapper = 7;
    
    enum SharingOperation {
        
        // Executed by invitee
        RETRIEVE_INVITATION = 0;
        
        // Executed by owner/invitee
        STOP_SHARING = 4;
        
        // Executed by owner
        CREATE_INVITE = 7;
        
        // Executed by invitee
        ACCEPT_INVITE = 9;
        
        // Executed by owner
        UPLOAD_KEYS = 10;
        
        // Executed by invitee
        UPLOAD_REENCRYPTED_KEYS = 11;
    }
}

message PrivateKeyWrapper {
    bytes privateKey = 1;
    bytes publicKey = 2;
}

// only for UploadScans, not UploadOwnerScans
message UploadScansResponse {
    repeated SightedDeviceInteraction sightedDeviceInteractions = 4;
    
    message SightedDeviceInteraction {
        repeated TruncatedEID truncatedEid = 1;
        bytes unwantedTrackingKey = 2;
        bytes ringKey = 3;
        bool isLost = 5;
    }
}

message RotateBleDeviceKeysRequest {
    CanonicId canonicId = 1;
    RotatedUserSecrets rotatedUserSecrets = 3;
    
    message RotatedUserSecrets {
        EncryptedUserSecrets encryptedUserSecrets = 1;
        PublicKeyIdList publicKeyIdList = 2;
        int32 pairDate = 3;
        bytes ringKey = 4;
        bytes recoveryKey = 5;
        bytes unwantedTrackingKey = 6;
        // ... and reencrypted location, left out here
    }
}

message UpdateBleDeviceRequest {
    
    UpdateBleDeviceValue value = 1;
    UpdateBleDeviceScope scope = 2;
    
    message UpdateBleDeviceValue {
        CanonicId canonicId = 1;
        DeviceDescription description = 2;
        EncryptedUserSecrets encryptedUserSecrets = 19;
        LostModeValue lostMode = 32;
        
        message LostModeValue {
            bool enableLostMode = 1;
        }
    }
    
    message UpdateBleDeviceScope {
        string scope = 1;
    }
}

message GetEidInfoForE2eeDevicesResponse {
    EncryptedOwnerKeyAndMetadata encryptedOwnerKeyAndMetadata = 4;
    
    message EncryptedOwnerKeyAndMetadata {
        bytes encryptedOwnerKey = 1;
        int32 ownerKeyVersion = 2;
        string securityDomain = 3;
        int32 domainKeyVersion = 4;
        int32 domainType = 5; // e.g. LSKF=0, account password, etc. => only LSKF is relevant
    }
}

message DevicesList {
    repeated DeviceMetadata deviceMetadata = 2;
}

message DevicesListRequest {
    DevicesListRequestPayload deviceListRequestPayload = 1;
    
    message DevicesListRequestPayload {
        DeviceType type = 1;
        string id = 3;
    }
}

enum DeviceType {
    UNKNOWN_DEVICE_TYPE = 0;
    ANDROID_DEVICE = 1;
    SPOT_DEVICE = 2;
    TEST_DEVICE_TYPE = 3;
    AUTO_DEVICE = 4;
    FASTPAIR_DEVICE = 5;
    SUPERVISED_ANDROID_DEVICE = 7;
}

message ExecuteActionRequest {
    ExecuteActionScope scope = 1;
    ExecuteActionType action = 2;
    ExecuteActionRequestMetadata requestMetadata = 3;
    
    message ExecuteActionScope {
        DeviceType type = 2;
        CanonicIds device = 3;
    }
}

message ExecuteActionRequestMetadata {
    DeviceType type = 1;
    string requestUuid = 2;
    string fmdClientUuid = 3;
    GcmCloudMessagingId gcmRegistrationId = 4;
    bool unknown = 6;
    
    message GcmCloudMessagingId {
        string id = 1;
    }
}

message ExecuteActionType {
    ExecuteActionLocateTrackerType locateTracker = 30;
    ExecuteActionSoundType startSound = 31;
    ExecuteActionSoundType stopSound = 32;
    
    message ExecuteActionLocateTrackerType {
        Time lastHighTrafficEnablingTime = 2;
        SpotContributorType contributorType = 3;
    }
    
    message ExecuteActionSoundType {
        DeviceComponent component = 1;
    }
    
    enum SpotContributorType {
        FMDN_DISABLED_DEFAULT = 0;
        FMDN_CONTRIBUTOR_HIGH_TRAFFIC = 3;
        FMDN_CONTRIBUTOR_ALL_LOCATIONS = 4;
        FMDN_HIGH_TRAFFIC = 1;
        FMDN_ALL_LOCATIONS = 2;
    }
}

enum DeviceComponent {
    DEVICE_COMPONENT_UNSPECIFIED = 0;
    DEVICE_COMPONENT_RIGHT = 1;
    DEVICE_COMPONENT_LEFT = 2;
    DEVICE_COMPONENT_CASE = 3;
}

message DeviceUpdate {
    ExecuteActionRequestMetadata fcmMetadata = 1;
    RequestMetadata requestMetadata = 2;
    DeviceMetadata deviceMetadata = 3;
    
    message RequestMetadata {
        Time requestTime = 1;
    }
}

message CanonicIds {
    repeated CanonicId canonicId = 1;
}

message CanonicId {
    string id = 1;
}

message DeviceMetadata {
    IdentifierInformation identifierInformation = 1;
    repeated SupportedActions supportedActions = 2;
    PhoneInformation phoneInformation = 3;
    DeviceInformation trackerInformation = 4;
    string userDefinedName = 5;
    ImageInformation imageInformation = 6;
    
    message PhoneInformation {
        string modelNumber = 3;
        string manufacturer = 4;
        string codename = 5;
        string carrier = 6;
        int32 imei = 7;
        DeviceInformation information = 26;
    }
    
    message IdentifierInformation {
        PhoneIdentifierInformation phoneIdentifierInformation = 1;
        IdentifierInformationType type = 2;
        CanonicIds canonicIds = 3;
        
        enum IdentifierInformationType {
            IDENTIFIER_UNKNOWN = 0;
            IDENTIFIER_ANDROID = 1;
            IDENTIFIER_SPOT = 2;
        }
        
        message PhoneIdentifierInformation {
            CanonicIds canonicIds = 2;
        }
    }
    
    message SupportedActions {
        ExecuteActionType type = 1;
        bool isSupported = 2;
    }
    
    message DeviceInformation {
        DeviceRegistration deviceRegistration = 1;
        LocationInformation locationInformation = 2;
        repeated AccessInformation accessInformation = 3;
        
        message LocationInformation {
            LocationsAndTimestampsWrapper reports = 3;
            
            message LocationsAndTimestampsWrapper {
                RecentLocationAndNetworkLocations recentLocationAndNetworkLocations = 4;
                
                message RecentLocationAndNetworkLocations {
                    LocationReport recentLocation = 1;
                    Time recentLocationTimestamp = 2;
                    repeated LocationReport networkLocations = 5;
                    repeated Time networkLocationTimestamps = 6;
                    int32 minLocationsNeededForAggregation = 9;
                }
            }
        }
    }
    
    message ImageInformation {
        string imageUrl = 1;
        int32 components = 2;
        repeated ComponentImage componentImages = 3;
        
        message ComponentImage {
            string imageUrl = 3;
        }
    }
}

message AccessInformation {
    string email = 1;
    bool hasAccess = 2;
    bool isOwner = 3;
    bool thisAccount = 4;
    SharingKeys sharingKeys = 7;
}

message SharingKeys {
    // For invitee, this is the owner's public key encrypted with the invitee's owner key
    // For owner, this is the owner's private key encrypted with the owner's owner key
    bytes inviterKey = 4;
    
    // For invitee, this is the invitee's private key encrypted with the invitee's owner key
    // For owner, this is the unencrypted invitee's key
    bytes inviteeKey = 5;
}

message DeviceRegistration {
    CanonicId canonicId = 1;
    DeviceDescription deviceDescription = 2;
    DeviceCapabilities capabilities = 11;
    bool isShared = 14;
    EncryptedUserSecrets encryptedKeys = 19;
    string manufacturer = 20;
    string fastPairModelId = 21;
    int32 pairDate = 23;
    int32 rotationExponent = 24;
    bytes ringKey = 25;
    bytes recoveryKey = 26;
    KeyRotationInformation keyRotationInformation = 29;
    DeviceEncryptionScheme deviceEncryptionScheme = 30;
    bytes unwantedTrackingKey = 31;
    LostModeInformation lostModeInformation = 32;
    Time firstSecretsCreationDate = 33;
    string model = 34;
    
    message KeyRotationInformation {
        repeated RotatedEIK rotatedEIKs = 2;
        bool keyRotationNeeded = 3;
        
        message RotatedEIK {
            bytes encryptedEIK = 1;
            Time creationDate = 8;
            Time rotationRequestDate = 9;
        }
    }
    
    message LostModeInformation {
        bool lostModeEnabled = 2;
    }
}

message LocationReport {
    SemanticLocation semanticLocation = 5;
    GeoLocation geoLocation = 10;
    Status status = 11;
    
    message GeoLocation {
        EncryptedReport encryptedReport = 1;
        int32 deviceTimeOffset = 2;
        float lastAggregatedAccuracy = 3;
        
        message EncryptedReport {
            bytes ephemeralPublicKey = 1;
            bytes encryptedLocation = 2;
            bool isOwnReport = 3;
        }
    }
    
    message SemanticLocation {
        string locationName = 1;
        int32 status = 5;
        SemanticLocationIdentifier semanticLocationIdentifier = 7;
        
        message SemanticLocationIdentifier {
            string uuid = 2;
        }
    }
    
    enum Status {
        SEMANTIC = 0;
        LAST_KNOWN = 1;
        CROWDSOURCED = 2;
        AGGREGATED = 3;
    }
}

enum SpotDeviceType {
    DEVICE_TYPE_UNKNOWN = 0;
    DEVICE_TYPE_BEACON = 1;
    DEVICE_TYPE_HEADPHONES = 2;
    DEVICE_TYPE_KEYS = 3;
    DEVICE_TYPE_WATCH = 4;
    DEVICE_TYPE_WALLET = 5;
    DEVICE_TYPE_BAG = 7;
    DEVICE_TYPE_LAPTOP = 8;
    DEVICE_TYPE_CAR = 9;
    DEVICE_TYPE_REMOTE_CONTROL = 10;
    DEVICE_TYPE_BADGE = 11;
    DEVICE_TYPE_BIKE = 12;
    DEVICE_TYPE_CAMERA = 13;
    DEVICE_TYPE_CAT = 14;
    DEVICE_TYPE_CHARGER = 15;
    DEVICE_TYPE_CLOTHING = 16;
    DEVICE_TYPE_DOG = 17;
    DEVICE_TYPE_NOTEBOOK = 18;
    DEVICE_TYPE_PASSPORT = 19;
    DEVICE_TYPE_PHONE = 20;
    DEVICE_TYPE_SPEAKER = 21;
    DEVICE_TYPE_TABLET = 22;
    DEVICE_TYPE_TOY = 23;
    DEVICE_TYPE_UMBRELLA = 24;
    DEVICE_TYPE_STYLUS = 25;
    DEVICE_TYPE_EARBUDS = 26;
}


message EncryptionUnlockRequestExtras {
    int32 operation = 1;
    SecurityDomain securityDomain = 2;
    string sessionId = 6;
    
    message SecurityDomain {
        string name = 1;
        int32 unknown = 2;
    }
}

message Location {
    sfixed32 latitude = 1;
    sfixed32 longitude = 2;
    int32 altitude = 3;
}

message Time {
    int32 seconds = 1;
    int32 nanos = 2;
}

message LocationReportsUpload {
    repeated Report reports = 1;
    ClientMetadata clientMetadata = 2;
    uint64 random1 = 3;
    uint64 random2 = 4;
    
    message Report {
        Advertisement advertisement = 1;
        Time time = 4;
        LocationReport location = 6;
        
        message Advertisement {
            TrackerIdentifier identifier = 5;
            bool unwantedTrackingModeEnabled = 6;
        }
    }
    
    message ClientMetadata {
        ClientVersionInformation version = 2;
        
        message ClientVersionInformation {
            string playServicesVersion = 1;
        }
    }
}

message TrackerIdentifier {
    
    // Only for foreign devices
    bytes truncatedEid = 6;
    
    // Only for own devices
    bytes canonicDeviceId = 7;
}

message GooglePublicKeys {
    EciesAeadHkdfPublicKeys eciesAeadHkdfPublicKeys = 1;
    EcdsaPublicKeys ecdsaPublicKeys = 2;
    
    message EciesAeadHkdfPublicKeys {
        repeated EciesAeadHkdfPublicKey keys = 2;
        
        message EciesAeadHkdfPublicKey {
            EciesAeadHkdfPublicKeyInformation keyInformation = 1;
            int32 keyIdentifier = 3;
            
            message EciesAeadHkdfPublicKeyInformation {
                string name = 1;
                EciesAeadHkdfPublicKeyMaterial material = 2;
                
                message EciesAeadHkdfPublicKeyMaterial {
                    bytes x = 3;
                    bytes y = 4;
                }
            }
        }
    }
    
    message EcdsaPublicKeys {
        // not needed for this thesis
    }
}


message UploadScansRequest {
    bytes reportsEncryptedWithServerKey = 1;
    string droidGuardResults = 2;
}

message GetEidInfoForE2eeDevicesRequest {
    int32 ownerKeyVersion = 1;
    bool hasOwnerKeyVersion = 2;
}

message DeleteBleDeviceRequest {
    CanonicId deviceToBeDeleted = 1;
}

message GetBleDeviceRequest {
    CanonicId device = 1;
}

message GetScannedDeviceInfoRequest {
    TrackerIdentifier identifier = 1;
    string languageTag = 3; // e.g. "en-us"
}

message GetScannedDeviceInfoResponse {
    int32 trackableComponent = 2;
    string manufacturerName = 5;
    repeated DeviceComponentInformation deviceComponentsInformation = 6;
    string modelName = 9;
    string disableTrackerInstructionsUrl = 10;
    repeated string enableOwnerInformationModeInstructions = 12;
}


// Example: 08 f1 ed cd 07 10 01 1a 05 64 65 2d 44 45 28 85 05 32 09 08 01 12 05 08 b9 c6 a8 74 38 00
message FastPairGetObservedDeviceRequest {
    int32 fastPairModelId = 1;
    string language = 3;
    FastPairGetObservedDeviceRequestMetadata metadata = 6;
    
    message FastPairGetObservedDeviceRequestMetadata {
        FastPairGetObservedDeviceRequestMetadataPlayServices playServices = 2;
        
        message FastPairGetObservedDeviceRequestMetadataPlayServices {
            int32 version = 1;
        }
    }
}

message FastPairGetObservedDeviceResponse {
    FastPairGetObservedDeviceResponseDeviceInformation deviceInformation = 1;
    
    message FastPairGetObservedDeviceResponseDeviceInformation {
        int32 fastPairModelId = 1;
        string deviceImage = 4;
        string modelName = 5;
        FastPairAntiSpoofingKeys keys = 9;
        string manufacturerName = 19;
        
        message FastPairAntiSpoofingKeys {
            bytes publicKey = 2;
        }
    }
}

message RegisterBleDeviceRequest {
    string fastPairModelId = 7;
    DeviceDescription description = 10;
    DeviceCapabilities capabilities = 11;
    
    E2EEPublicKeyRegistration e2eePublicKeyRegistration = 16;
    
    string manufacturerName = 17;
    bytes ringKey = 21;
    bytes recoveryKey = 22;
    bytes unwantedTrackingKey = 24;
    string modelName = 25;
}

message PublicKeyIdList {
    repeated PublicKeyIdInfo publicKeyIdInfo = 1;
    
    message PublicKeyIdInfo {
        Time timestamp = 1;
        TruncatedEID publicKeyId = 2;
        int32 trackableComponent = 3;
    }
}

message TruncatedEID {
    bytes truncatedEid = 1;
}

message E2EEPublicKeyRegistration {
    int32 rotationExponent = 1;
    EncryptedUserSecrets encryptedUserSecrets = 3;
    PublicKeyIdList publicKeyIdList = 4;
    int32 pairingDate = 5;
    DeviceEncryptionScheme deviceEncryptionScheme = 6;
}

enum DeviceEncryptionScheme {
    EID_20_BYTES = 0;
    EID_32_BYTES = 1;
}

message EncryptedUserSecrets {
    bytes encryptedIdentityKey = 1;
    int32 ownerKeyVersion = 3;
    bytes encryptedAccountKey = 4;
    
    SharingKeys sharingKeys = 6;
    
    // creation date of secrets, if created with owner key
    Time creationDate = 8;
    
    // previous EIK date, if new EIK encrypted with old EIK.
    // Note: May be wrong, because we never saw UserSecrets with the new EIK encrypted with the old EIK.
    Time previousEikDate = 9;
    
    bool encryptedWithSharedSecret = 10;
    bytes encryptedSha256AccountKeyPublicAddress = 11;
}

message DeviceDescription {
    string userDefinedName = 1;
    SpotDeviceType deviceType = 2;
    repeated DeviceComponentInformation deviceComponentsInformation = 9;
    SpotBeaconType beaconType = 11;
    ContactInfo contactInfo = 12;
    RingingVolume ringingVolume = 13;
    
    message ContactInfo {
        string phoneNumber = 1;
        string infoMessage = 2;
        string email = 4;
    }
    
    enum RingingVolume {
        FACTORY_DEFAULT = 0;
        LOW = 1;
        MEDIUM = 2;
        HIGH = 3;
    }
}

message DeviceComponentInformation {
    string imageUrl = 1;
    DeviceComponent deviceComponent = 2;
}

enum SpotBeaconType {
    BEACON_TYPE_DEFAULT_TAG = 0;
    BEACON_TYPE_EMBEDDED = 1;
    BEACON_TYPE_SELF_REPORT_ONLY = 2;
    BEACON_TYPE_SELF_REPORT_OR_ADVERTISING = 3;
    BEACON_TYPE_NON_ADVERTISING_ACCESSORY = 4;
}

message DeviceCapabilities {
    bool isAdvertising = 1;
    bool ringingVolumeSupported = 4;
    int32 capableComponents = 5;
    int32 trackableComponents = 6;
}

message ListEidsForBleDevicesResponse {
    repeated DevicePublicKeyIds deviceEids = 1;
    
    message DevicePublicKeyIds {
        CanonicId canonicId = 1;
        int32 rotationPeriod = 3;
        PublicKeyIdList serverList = 4;
    }
}

message UploadPrecomputedPublicKeyIdsRequest {
    repeated DevicePublicKeyIds deviceEids = 1;
    
    message DevicePublicKeyIds {
        CanonicId canonicId = 1;
        PublicKeyIdList clientList = 2;
        int32 pairDate = 3;
    }
}

message GetBleDeviceResponse {
    DeviceRegistration deviceRegistration = 1;
}
